<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER_STUDIO — Spatial Design Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HUD Overlay -->
  <div id="hud">
    <div id="hud-logo">AETHER_STUDIO</div>
    <div id="hud-status">
      <span id="status-tracking" class="status-dot offline"></span>
      <span id="status-label">TRACKING OFFLINE</span>
    </div>
    <div id="hud-coords">
      <div class="coord-row"><span class="axis x">X</span> <span id="coord-x">---</span></div>
      <div class="coord-row"><span class="axis y">Y</span> <span id="coord-y">---</span></div>
      <div class="coord-row"><span class="axis z">Z</span> <span id="coord-z">---</span></div>
    </div>
    <div id="hud-gesture">
      <span id="gesture-label">GESTURE: IDLE</span>
    </div>
    <div id="hud-snap">
      <span id="snap-label">SNAP: OFF</span>
    </div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="sculpt" title="Sculpt Mode">✦</button>
    <button class="tool-btn" data-tool="extrude" title="Extrude">⬆</button>
    <button class="tool-btn" data-tool="measure" title="Measure">⌖</button>
    <button class="tool-btn" data-tool="clear" title="Clear Scene">✕</button>
  </div>

  <!-- Snap Grid Toggle -->
  <div id="controls-bottom">
    <button id="btn-snap" class="ctrl-btn">SNAP OFF</button>
    <button id="btn-grid" class="ctrl-btn active">GRID ON</button>
    <button id="btn-camera" class="ctrl-btn">CAMERA</button>
    <button id="btn-export" class="ctrl-btn">EXPORT STL</button>
  </div>

  <!-- Main 3D Canvas -->
  <canvas id="viewport"></canvas>

  <!-- Webcam feed (optical telemetry) -->
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="tracking-canvas"></canvas>

  <!-- Gesture Visualizer -->
  <div id="gesture-ring" class="hidden"></div>

  <!-- Notification -->
  <div id="notification"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.163.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="engine.js"></script>
</body>
</html>
